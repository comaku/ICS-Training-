/* v2: game startup, not a demo dashboard. No pause, replay, or motion controls. */
.splash{--dock-height:240px;min-height:0}
.hud{justify-content:flex-start}
.art-action{bottom:calc(var(--dock-height) + 22px)}
.hype{min-height:49px;font-size:11px;box-shadow:0 7px 25px #02194498,0 0 0 2px #ffffff24;transition:filter .16s ease}
.hype:active{filter:brightness(1.2)}
.load-dock{padding-bottom:calc(22px + var(--safe-bottom));}
.loading-note{padding-top:13px;margin-top:13px;border-top:1px solid #bbdfff37;color:#bcd8f2;text-align:center;font-size:10px;font-weight:750;letter-spacing:.065em;}
.particle-layer{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden;contain:layout style}
.hype-particle{position:absolute;left:0;top:0;pointer-events:none;display:grid;place-items:center;will-change:transform,opacity;animation:hype-launch var(--life,950ms) cubic-bezier(.16,.7,.17,1) forwards;transform-origin:center}
.hype-particle.emoji{font-size:clamp(19px,6vw,34px);filter:drop-shadow(0 3px 4px #021a4288)}
.hype-particle.sticker{width:clamp(37px,11vw,55px);height:clamp(42px,12vw,62px);border:3px solid white;background:linear-gradient(150deg,#fff,#c6f2ff);color:#10224f;border-radius:12px;box-shadow:0 7px 15px #03193786;font-size:clamp(20px,6vw,30px)}
.hype-particle.confetti{width:var(--pw,9px);height:var(--ph,15px);background:var(--pc,#ffe45c);border:1px solid #fff8;border-radius:2px;box-shadow:0 2px 7px #03173355}
@keyframes hype-launch{0%{transform:translate3d(-50%,-50%,0) rotate(0deg) scale(.4);opacity:0}8%{opacity:1}70%{opacity:1}100%{transform:translate3d(calc(-50% + var(--dx)),calc(-50% + var(--dy)),0) rotate(var(--spin)) scale(var(--final-scale,.85));opacity:0}}
/* Launcher must never show an unearned 'ready' panel. */
@media(max-width:359px){.art-action{bottom:calc(var(--dock-height) + 12px)}.hype{min-height:45px}}
@media(max-height:700px) and (orientation:portrait){.art-action{bottom:calc(var(--dock-height) + 10px)}.loading-note{padding-top:9px;margin-top:10px}}
@media(orientation:landscape) and (max-height:530px){.art-action{left:0;right:48%;bottom:20px}.load-dock{padding-top:calc(40px + var(--safe-top));padding-bottom:calc(16px + var(--safe-bottom))}.loading-note{font-size:9px}}
@media(prefers-reduced-motion:reduce){.hype-particle{animation-name:hype-calm!important;animation-duration:450ms!important}@keyframes hype-calm{0%{opacity:0;transform:translate3d(-50%,-50%,0) scale(.75)}25%{opacity:1}100%{opacity:0;transform:translate3d(calc(-50% + var(--dx) * .25),calc(-50% + var(--dy) * .25),0) scale(1)}}}

/* Sticker Clash startup v3.

   Production: set window.STICKER_CLASH_LOADER_CONFIG={mode:'manual',nextUrl:'./your-game-route'}

*/
(()=>{'use strict';
  const $=id=>document.getElementById(id);
  const input=window.STICKER_CLASH_LOADER_CONFIG||{};
  const params=new URLSearchParams(location.search);
  const mode=params.get('mode')==='manual'||input.mode==='manual'?'manual':'preview';
  const duration=Math.max(1000,Number(input.duration)||7800);
  const nextUrl=typeof input.nextUrl==='string'&&input.nextUrl.trim()?input.nextUrl:(mode==='preview'?'./admin.html':null);
  const el={splash:$('splash'),fill:$('progressFill'),glint:$('glint'),rail:$('progressRail'),percent:$('percentText'),phase:$('phaseTitle'),status:$('statusText'),stage:$('stageText'),mode:$('modeLabel'),hype:$('hypeBtn'),count:$('hypeCount'),particles:$('particleLayer'),dock:document.querySelector('.load-dock')};
  const steps=[{min:0,title:'Loading the game…',message:'Warming up the arena…',part:'01 / 03'},
    {min:28,title:'Getting stickers ready.',message:'Preparing your reactions…',part:'02 / 03'},
    {min:72,title:'Almost battle time.',message:'Putting the finishing touches on…',part:'02 / 03'},
    {min:92,title:'Almost ready…',message:'Opening the arena…',part:'02 / 03'},
    {min:100,title:'Game ready!',message:'Entering the arena…',part:'03 / 03'}];
  let progress=0,ready=false,last=0,raf=0,finishing=false,hypes=0,particles=0,latestMessage='',stageAnnounced='';
  const clamp=n=>Math.min(100,Math.max(0,Number(n)||0));
  function sizeDock(){el.splash.style.setProperty('--dock-height',Math.ceil(el.dock.getBoundingClientRect().height)+'px');}
  sizeDock();window.addEventListener('resize',sizeDock,{passive:true});
  if('ResizeObserver' in window)new ResizeObserver(sizeDock).observe(el.dock);
  function paint(value,message){
    progress=clamp(value);
    const rounded=Math.round(progress),step=steps.filter(s=>s.min<=progress).at(-1);
    el.fill.style.width=progress+'%';el.glint.style.left=progress+'%';el.glint.style.opacity=progress>4&&progress<99?'1':'0';
    el.percent.innerHTML=rounded+'<span>%</span>';
    el.rail.setAttribute('aria-valuenow',String(rounded));
    el.rail.setAttribute('aria-valuetext',(message||step.message)+' '+rounded+' percent');
    el.phase.textContent=step.title;el.stage.textContent=step.part;
    const status=message||step.message;
    if(status!==stageAnnounced){el.status.textContent=status;stageAnnounced=status;}
    [28,72,100].forEach((n,i)=>$('stage'+(i+1)).classList.toggle('done',progress>=n));

  }
  function stop(){if(raf)cancelAnimationFrame(raf);raf=0;last=0;}
  function complete(){
    if(ready)return;

    const dy=-(50+Math.random()*Math.min(h*.48,340));
    const spin=((Math.random()-.5)*920)+'deg';
    const life=(700+Math.random()*700)+'ms';
    p.style.cssText=`left:${x}px;top:${y}px;--dx:${dx}px;--dy:${dy}px;--spin:${spin};--life:${life};--final-scale:${(.65+Math.random()*.6).toFixed(2)}`;
    if(kind==='confetti'){
      p.style.setProperty('--pw',(5+Math.random()*7)+'px');p.style.setProperty('--ph',(10+Math.random()*11)+'px');
      p.style.setProperty('--pc',confettiColors[Math.floor(Math.random()*confettiColors.length)]);
    }else{p.textContent=emojis[Math.floor(Math.random()*emojis.length)];}
    particles++;el.particles.appendChild(p);
    const cleanup=()=>{if(p.isConnected){p.remove();particles=Math.max(0,particles-1);}};
    p.addEventListener('animationend',cleanup,{once:true});setTimeout(cleanup,1600);
  }
  el.hype.addEventListener('click',()=>{
    hypes++;el.count.textContent=String(hypes);
    const r=el.hype.getBoundingClientRect(),s=el.splash.getBoundingClientRect();
    const x=r.left+r.width/2-s.left,y=r.top+r.height/2-s.top;
    for(let i=0;i<3;i++)particle('sticker',x,y);
    for(let i=0;i<5;i++)particle('emoji',x,y);
    for(let i=0;i<10;i++)particle('confetti',x,y);
    el.hype.classList.remove('popped');void el.hype.offsetWidth;el.hype.classList.add('popped');
  });
  window.StickerClashLoader=Object.freeze({
    setProgress(value,message){
      if(mode!=='manual'){console.warn('Configure mode: manual to feed real game startup progress; preview completes automatically.');return;}
      if(ready||finishing)return;
      const requested=Math.min(99,clamp(value));
      // Reject backwards progress and 100-before-ready; explicit finish() is the only completion gate.
      if(requested<progress)return;
      latestMessage=typeof message==='string'?message:'';
      paint(requested,latestMessage);
    },
    finish,
    fail(message){stop();el.phase.textContent='Could not start the game.';el.status.textContent=message||'Connection failed. Please reopen the game.';el.mode.textContent='STARTUP ERROR';el.rail.setAttribute('aria-valuetext','Startup error');document.dispatchEvent(new CustomEvent('stickerclash:error',{detail:{message}}));},
    getProgress(){return progress;}
  });
  el.mode.textContent=mode==='preview'?'PLEASE WAIT · LOADING GAME PREVIEW':'PLEASE WAIT · LOADING GAME';
  paint(0,mode==='preview'?'Warming up the arena…':'Starting game initialization…');
  if(mode==='preview')raf=requestAnimationFrame(previewFrame);
})();

</script>
